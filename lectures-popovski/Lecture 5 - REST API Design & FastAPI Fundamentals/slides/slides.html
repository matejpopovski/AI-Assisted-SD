<header>AI-Assisted Software Development and Intelligent Applications</header>
<h1 id="status-codes-that-matter">Status Codes That Matter</h1>
<div style="display: flex; gap: 1.5em; font-size: 0.75em">
<div style="flex: 1">
<p><strong>2xx — it worked · 5xx — the <em>server</em> failed</strong></p>
<table>
<thead>
<tr>
<th>Code</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>200 OK</code></td>
<td>Success (GET, PUT, PATCH)</td>
</tr>
<tr>
<td><code>201 Created</code></td>
<td>A new resource now exists (POST)</td>
</tr>
<tr>
<td><code>204 No Content</code></td>
<td>Success, nothing to send back (DELETE)</td>
</tr>
<tr>
<td><code>500</code></td>
<td>Server bug — not the client's fault</td>
</tr>
<tr>
<td><code>503</code></td>
<td>Server down or overloaded — retry</td>
</tr>
</tbody>
</table>
</div>
<div style="flex: 1">
<p><strong>4xx — the <em>client</em> got something wrong</strong></p>
<table>
<thead>
<tr>
<th>Code</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>400</code></td>
<td>Malformed request</td>
</tr>
<tr>
<td><code>401</code></td>
<td>Not authenticated</td>
</tr>
<tr>
<td><code>403</code></td>
<td>Authenticated, but not allowed</td>
</tr>
<tr>
<td><code>404</code></td>
<td>Resource doesn't exist</td>
</tr>
<tr>
<td><code>422</code></td>
<td>Well-formed, but invalid data</td>
</tr>
<tr>
<td><code>429</code></td>
<td>Rate-limited — back off, retry later</td>
</tr>
</tbody>
</table>
</div>
</div>
<footer>REST API Design &amp; FastAPI Fundamentals</footer>
</section>

<header>AI-Assisted Software Development and Intelligent Applications</header>
<h1 id="think-like-an-architect">Think Like an Architect</h1>
<div style="text-align: center; margin-top: -0.3em">
<svg style="letter-spacing: 0; font-family: Helvetica, Arial, sans-serif" viewBox="0 0 1140 460" width="100%" xmlns="http://www.w3.org/2000/svg">
<g opacity="1">
<text x="40" y="30" font-size="14" fill="#777" letter-spacing="2" font-weight="bold">WHAT ARE THE OBJECTS?</text><line x1="40" y1="42" x2="370" y2="42" stroke="#bbb" stroke-width="1.5" />
<rect x="60" y="62" width="200" height="140" rx="8" fill="#fff" stroke="#333" stroke-width="2" />
<rect x="60" y="62" width="200" height="32" rx="8" fill="#333" /><rect x="60" y="82" width="200" height="12" fill="#333" />
<text x="160" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Book</text>
<text x="76" y="118" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">id</text>
<text x="76" y="140" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">title</text>
<text x="76" y="162" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">author</text>
<text x="76" y="184" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">published_year</text>
<rect x="60" y="236" width="200" height="164" rx="8" fill="#fff" stroke="#333" stroke-width="2" />
<rect x="60" y="236" width="200" height="32" rx="8" fill="#333" /><rect x="60" y="256" width="200" height="12" fill="#333" />
<text x="160" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Review</text>
<text x="76" y="292" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">id</text>
<text x="76" y="314" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">book_id  ─────►</text>
<text x="76" y="336" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">reviewer_name</text>
<text x="76" y="358" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">rating  (1–5)</text>
<text x="76" y="380" font-size="14" fill="#333" font-family="Menlo, Consolas, monospace">review_text</text>
<path d="M262,314 H300 V132 H262" fill="none" stroke="#333" stroke-width="2" />
<text x="308" y="128" font-size="13" fill="#777" font-weight="bold">1</text>
<text x="308" y="319" font-size="13" fill="#777" font-weight="bold">many</text>
<text x="160" y="424" text-anchor="middle" font-size="13" fill="#777" font-style="italic">a review belongs to exactly one book</text>
</g>
<g opacity="0.18">
<text x="400" y="30" font-size="14" fill="#777" letter-spacing="2" font-weight="bold">HOW DO THEY CHANGE?</text><line x1="400" y1="42" x2="760" y2="42" stroke="#bbb" stroke-width="1.5" />
<text x="400" y="74" font-size="17" font-weight="bold" fill="#333">Review</text>
<circle cx="410" cy="101" r="4" fill="#c5050c" />
<text x="424" y="106" font-size="15" fill="#333">created by a reader</text>
<rect x="580" y="90" width="180" height="24" rx="12" fill="#fff" stroke="#c5050c" stroke-width="1.5" /><text x="670.0" y="107" text-anchor="middle" font-size="12.5" fill="#c5050c" font-weight="bold" font-family="Menlo, Consolas, monospace">POST /reviews</text>
<circle cx="410" cy="135" r="4" fill="#c5050c" />
<text x="424" y="140" font-size="15" fill="#333">read, all or by book</text>
<rect x="580" y="124" width="180" height="24" rx="12" fill="#fff" stroke="#c5050c" stroke-width="1.5" /><text x="670.0" y="141" text-anchor="middle" font-size="12.5" fill="#c5050c" font-weight="bold" font-family="Menlo, Consolas, monospace">GET /reviews</text>
<circle cx="410" cy="169" r="4" fill="#c5050c" />
<text x="424" y="174" font-size="15" fill="#333">edited by author</text>
<rect x="580" y="158" width="180" height="24" rx="12" fill="#fff" stroke="#c5050c" stroke-width="1.5" /><text x="670.0" y="175" text-anchor="middle" font-size="12.5" fill="#c5050c" font-weight="bold" font-family="Menlo, Consolas, monospace">PATCH /reviews/{id}</text>
<circle cx="410" cy="203" r="4" fill="#c5050c" />
<text x="424" y="208" font-size="15" fill="#333">removed by author</text>
<rect x="580" y="192" width="180" height="24" rx="12" fill="#fff" stroke="#c5050c" stroke-width="1.5" /><text x="670.0" y="209" text-anchor="middle" font-size="12.5" fill="#c5050c" font-weight="bold" font-family="Menlo, Consolas, monospace">DELETE /reviews/{id}</text>
<text x="400" y="266" font-size="17" font-weight="bold" fill="#333">Book</text>
<circle cx="410" cy="293" r="4" fill="#c5050c" />
<text x="424" y="298" font-size="15" fill="#333">read, all or one</text>
<rect x="580" y="282" width="180" height="24" rx="12" fill="#fff" stroke="#c5050c" stroke-width="1.5" /><text x="670.0" y="299" text-anchor="middle" font-size="12.5" fill="#c5050c" font-weight="bold" font-family="Menlo, Consolas, monospace">GET /books/{id}</text>
<text x="424" y="332" font-size="13" fill="#777" font-style="italic">no POST /books — the catalog is seeded, not posted</text>
<text x="424" y="380" font-size="13" fill="#777" font-style="italic">Book barely changes. Review has a whole life.</text>
<text x="424" y="400" font-size="13" fill="#777" font-style="italic">That asymmetry is a design fact, not an accident.</text>
</g>
<g opacity="0.18">
<text x="790" y="30" font-size="14" fill="#777" letter-spacing="2" font-weight="bold">WHAT CAN GO WRONG?</text><line x1="790" y1="42" x2="1100" y2="42" stroke="#bbb" stroke-width="1.5" />
<text x="790" y="106" font-size="15" fill="#333">the book doesn't exist</text>
<rect x="1028" y="89" width="72" height="26" rx="6" fill="#fff" stroke="#c5050c" stroke-width="1.5" /><text x="1064" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#c5050c" font-family="Menlo, Consolas, monospace">404</text>
<text x="790" y="146" font-size="15" fill="#333">rating isn't 1–5</text>
<rect x="1028" y="129" width="72" height="26" rx="6" fill="#fff" stroke="#c5050c" stroke-width="1.5" /><text x="1064" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#c5050c" font-family="Menlo, Consolas, monospace">422</text>
<text x="790" y="186" font-size="15" fill="#333">a required field is missing</text>
<rect x="1028" y="169" width="72" height="26" rx="6" fill="#fff" stroke="#c5050c" stroke-width="1.5" /><text x="1064" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#c5050c" font-family="Menlo, Consolas, monospace">422</text>
<text x="790" y="226" font-size="15" fill="#777">it isn't your review</text>
<rect x="1028" y="209" width="72" height="26" rx="6" fill="#fff" stroke="#777" stroke-width="1.5" /><text x="1064" y="227" text-anchor="middle" font-size="14" font-weight="bold" fill="#777" font-family="Menlo, Consolas, monospace">403</text>
<text x="790" y="266" font-size="15" fill="#333">our own code blew up</text>
<rect x="1028" y="249" width="72" height="26" rx="6" fill="#333" stroke="#333" stroke-width="1.5" /><text x="1064" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="Menlo, Consolas, monospace">500</text>
<text x="790" y="320" font-size="13" fill="#777" font-style="italic">403 needs auth — that's Lecture 8.</text>
<text x="790" y="368" font-size="13" fill="#777" font-style="italic">This column is the one a first draft</text>
<text x="790" y="388" font-size="13" fill="#777" font-style="italic">always skips. Ask for it — sycophant challenge.</text>
</g>
<text x="205" y="448" text-anchor="middle" font-size="19"><tspan fill="#c5050c" font-weight="bold">Nouns</tspan><tspan fill="#c5050c">&#160;become resources.</tspan></text>
<text x="580" y="448" text-anchor="middle" font-size="19"><tspan fill="#333" font-weight="bold">Changes</tspan><tspan fill="#777">&#160;become methods.</tspan></text>
<text x="945" y="448" text-anchor="middle" font-size="19"><tspan fill="#333" font-weight="bold">What goes wrong</tspan><tspan fill="#777">&#160;becomes status codes.</tspan></text>
</svg>
</div>

<h1 id="path-query-body">Path, Query, Body</h1>
<div style="text-align: center; margin-top: -0.3em">
<svg style="letter-spacing: 0; font-family: Helvetica, Arial, sans-serif" viewBox="0 0 1140 456" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="m_path" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c5050c" /></marker><marker id="m_query" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a6fb0" /></marker><marker id="m_body" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7f2a" /></marker></defs>
<text x="40" y="70" font-size="22" fill="#c5050c" font-weight="bold" font-family="Menlo, Consolas, monospace">POST </text>
<text x="106.0" y="70" font-size="22" fill="#333" font-family="Menlo, Consolas, monospace">/books/</text>
<text x="211.59999999999997" y="70" font-size="22" fill="#333" font-family="Menlo, Consolas, monospace">/reviews</text>
<text x="40" y="268" font-size="16" fill="#777" font-family="Menlo, Consolas, monospace">@router.post("/books/<tspan fill="none">{book_id}</tspan>/reviews", status_code=201)</text>
<text x="40" y="304" font-size="21" fill="#333" font-family="Menlo, Consolas, monospace">def create_review(</text>
<text x="417.99999999999994" y="304" font-size="21" fill="#333" font-family="Menlo, Consolas, monospace">, </text>
<text x="695.1999999999999" y="304" font-size="21" fill="#333" font-family="Menlo, Consolas, monospace">, </text>
<text x="985.0" y="304" font-size="21" fill="#333" font-family="Menlo, Consolas, monospace">):</text>
<g opacity="1">
<text x="198.39999999999998" y="70" font-size="22" fill="#c5050c" font-weight="bold" font-family="Menlo, Consolas, monospace">1</text>
<rect x="198.39999999999998" y="80" width="13.199999999999989" height="4" rx="2" fill="#c5050c" />

<header>AI-Assisted Software Development and Intelligent Applications</header>
<h1 id="fastapi-pydantic-models">FastAPI: Pydantic Models</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, Field

<span class="hljs-keyword">class</span> <span class="hljs-title class_">ReviewCreate</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):
    book_id: <span class="hljs-built_in">int</span>
    reviewer_name: <span class="hljs-built_in">str</span>
    rating: <span class="hljs-built_in">int</span> = Field(ge=<span class="hljs-number">1</span>, le=<span class="hljs-number">5</span>)
    review_text: <span class="hljs-built_in">str</span>
</code></pre>
<p>Request bodies are validated <strong>before</strong> your function runs — invalid data never reaches your code; FastAPI returns <code>422</code> automatically.</p>
<footer>REST API Design &amp; FastAPI Fundamentals</footer>

</code></pre>
<p><code>response_model</code> shapes and validates what goes <em>out</em>, independent of your internal data — and documents the response shape in Swagger automatically.</p>

<header>AI-Assisted Software Development and Intelligent Applications</header>
<h1 id="a-real-app-is-not-one-server">A Real App Is Not One Server</h1>
<div style="font-size: 0.78em">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">clients                      one public URL          identical backend instances
browser ──┐                                          ┌── api-1 ──┐
phone   ──┼──► api.example.com ──► load balancer ────┼── api-2 ──┼──► MySQL · Redis
curl    ──┘                        (nginx)           └── api-3 ──┘
</code></pre>
<ul>
<li>Instances get <strong>added</strong> under load, <strong>replaced</strong> on every deploy, and <strong>restarted</strong> when they crash.</li>
<li>The client never learns which instance answered — and its next request may land on a different one.</li>
<li>Project 2 runs exactly this shape on your laptop: nginx in front, FastAPI behind, MySQL and Redis shared.</li>
</ul>
</div>
<footer>REST API Design &amp; FastAPI Fundamentals</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="AI-Assisted Software Development and Intelligent Applications" data-footer="REST API Design &amp; FastAPI Fundamentals" data-theme="course" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--header:AI-Assisted Software Development and Intelligent Applications;--footer:REST API Design &amp; FastAPI Fundamentals;--theme:course;" data-marpit-pagination-total="33">
<header>AI-Assisted Software Development and Intelligent Applications</header>
<h1 id="in-memory--one-server-design">In-Memory = One-Server Design</h1>
<div style="font-size: 0.85em">
<p>Your <code>review_service.py</code> will keep reviews in a module-level Python list.</p>
<ul>
<li>On one instance: correct, all 19 tests pass.</li>
<li>On two instances: <code>POST /reviews</code> lands on <code>api-1</code>, the next <code>GET</code> lands on <code>api-2</code> — the review is gone.</li>
</ul>
<p>Not a bug in your code — a fact about <strong>where state lives</strong>. That's why Lecture 6 moves it to MySQL.</p>
</div>
<footer>REST API Design &amp; FastAPI Fundamentals</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="AI-Assisted Software Development and Intelligent Applications" data-footer="REST API Design &amp; FastAPI Fundamentals" data-theme="course" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--header:AI-Assisted Software Development and Intelligent Applications;--footer:REST API Design &amp; FastAPI Fundamentals;--theme:course;" data-marpit-pagination-total="33">
<header>AI-Assisted Software Development and Intelligent Applications</header>
<h1 id="why-rest-is-stateless">Why REST Is Stateless</h1>
<div style="font-size: 0.82em">
<p>Because <em>any</em> instance may answer <em>any</em> request, no instance can be the one that &quot;remembers&quot; a client.</p>
<ul>
<li>Every request carries everything needed: <strong>which resource</strong> (URL), <strong>what data</strong> (body), <strong>who you are</strong> (a header — Lecture 8's JWT).</li>
<li>State that must outlive a request lives in <strong>shared storage every instance can reach</strong>: the database (Lecture 6), Redis (Lecture 9).</li>
<li>The payoff: scaling means adding instances behind the balancer. <strong>Your route code doesn't change.</strong></li>
</ul>
</div>
<footer>REST API Design &amp; FastAPI Fundamentals</footer>
</section>

<header>AI-Assisted Software Development and Intelligent Applications</header>
<h1 id="when-to-go-local-first">When to Go Local-First</h1>
<div style="display: flex; gap: 2em; font-size: 0.8em">
<div style="flex: 1">
<p><strong>Go local-first when:</strong></p>
<ul>
<li>Users keep working with no connection — email on a plane, mobile apps</li>
<li>Every click must feel instant — no round trip first</li>
<li>Several people edit the same thing at once — docs, boards, design tools</li>
</ul>
</div>
<div style="flex: 1">
<p><strong>Stay thin when:</strong></p>
<ul>
<li>Data too large or too sensitive to copy to every client</li>
<li>The server must decide <em>before</em> anything appears — payments, grades</li>
<li>You're learning the contract model — where we are today</li>
</ul>
</div>
</div>
<footer>REST API Design &amp; FastAPI Fundamentals</footer>
